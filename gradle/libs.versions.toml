[versions]

# ... PROJECT ...
java = "21"
kotlin = "2.4.10"
androidGradlePlugin = "9.3.1"
gmsPlugin = "4.5.0"
ksp = "2.3.11"
dokka = "2.2.0"
dokkaMermaid = "0.6.0"
secrets = "2.0.1"
dependencyGuard = "0.5.0"
# Lint tooling version tracks AGP: AGP 9.x maps to android tools 32.x
androidTools = "32.3.1"
# Macrobenchmark and the baseline profile plugin share a version; 1.5.x is the AGP 9 line.
androidxMacroBenchmark = "1.5.0-beta01"
androidxProfileInstaller = "1.4.1"
androidxUiAutomator = "2.4.0"

# ... CORE:ANDROID ...
androidxCore = "1.19.0"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0-0.6.x-compat"
kotlinxSerializationJson = "1.11.0"
timber = "5.0.1"

# ... CORE:UI ...
androidxNavigation3 = "1.1.5"
androidxSavedState = "1.5.0"
androidxComposeMaterial3AdaptiveNav3 = "1.3.0-rc01"
androidxFragment = "1.8.9"
androidxAppCompat = "1.7.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxComposeBom = "2026.06.01"
androidxCoreSplashscreen = "1.2.0"
androidxHiltNavigationCompose = "1.4.0"
lottieCompose = "6.7.1"
# FIXME: Remove this once stable
materialExpressive = "1.5.0-alpha25"

# ... NETWORK ...
okhttp = "5.4.0"
retrofit = "3.0.0"
coil = "2.7.0"

# ... STORAGE:PREFERENCES ...
androidxDataStore = "1.2.1"

# ... STORAGE:ROOM ...
room = "2.8.4"

# ... AUTH ...
playServicesAuth = "21.6.0"
androidxCredentials = "1.6.0"
identityGoogleId = "1.2.0"

# ... FIREBASE ...
firebaseBom = "34.17.0"
firebaseCrashlyticsPlugin = "3.0.7"
firebasePerfPlugin = "2.0.2"

# ... DAGGER-HILT ...
daggerHilt = "2.60.1"
daggerHiltExt = "1.4.0"

# ... Open Source Licenses ...
googleOss = "17.5.1"
googleOssPlugin = "0.13.0"

# ... LEAK CANARY ...
leakcanaryAndroid = "2.14"

# ... WORK MANAGER ...
workVersion = "2.11.2"

# ... TESTING ...
junit = "4.13.2"
# androidx.test:core and androidx.test.ext:junit are on separate version lines.
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
robolectric = "4.16.1"
turbine = "1.2.1"
truth = "1.4.5"

# ... SDK-CONFIG ...
minSdk = "24"
compileSdk = "37"
targetSdk = "36"


[plugins]

kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
firebase-perf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerfPlugin" }
gms = { id = "com.google.gms.google-services", version.ref = "gmsPlugin" }
dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "daggerHilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
