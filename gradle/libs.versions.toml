dependency-guard = { id = "com.dropbox.dependency-guard", version.ref = "dependencyGuard" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxMacroBenchmark" }

# ... Custom Plugins ...
jetpack-library = { id = "dev.atick.library" }
jetpack-ui-library = { id = "dev.atick.ui.library" }
jetpack-application = { id = "dev.atick.application" }
jetpack-dagger-hilt = { id = "dev.atick.dagger.hilt" }
jetpack-firebase = { id = "dev.atick.firebase" }
jetpack-dokka = { id = "dev.atick.dokka" }
jetpack-test = { id = "dev.atick.test" }

