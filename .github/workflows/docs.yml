name: 📚 Documentation Validation & Deployment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 📖 Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: ⬇️ Checkout Documented Revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DOCS_REVISION }}

      - name: ✅ Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.0

      - name: 📜 Copy CI gradle.properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: 🏗️ Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: 📦 Install Documentation Tools
        run: python -m pip install mkdocs mkdocs-material mkdocs-github-admonitions-plugin==0.1.1 Pygments

      - name: 🧪 Test Site Preparation
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: 🏗️ Generate Real API Documentation
        run: ./gradlew dokkaGeneratePublicationHtml -PdocsRevision="$DOCS_REVISION"

      - name: 📂 Prepare and Validate Site
        run: |
          python scripts/prepare_docs.py --revision "$DOCS_REVISION"
          python -m mkdocs build --strict --config-file build/docs-mkdocs.yml
          python scripts/check_docs.py --site site

      - name: 📦 Save Validated Site
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site
          path: site/
          retention-days: 7

  deploy:
    name: 🚀 Deploy Validated Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📥 Download Validated Site
        uses: actions/download-artifact@v8
        with:
          name: documentation-site
          path: site/

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: 🚀 Deploy Without Rebuilding
        run: |
          python -m pip install mkdocs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --message "[no-task] docs: publish documentation for $GITHUB_SHA" site
