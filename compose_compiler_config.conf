// Classes the Compose compiler should treat as stable.
//
// The compiler cannot prove stability for types it does not compile in the same module, so it
// conservatively assumes they are unstable and stops skipping recomposition for any composable
// that reads them. Listing them here restores skipping.
//
// Only add types that really are immutable — an entry here is a promise the compiler trusts
// without checking.
//
// See https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file

// Data layer models. Immutable data classes of primitives, passed straight to feature screens.
dev.atick.data.model.**
